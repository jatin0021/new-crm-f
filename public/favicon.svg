<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021f18" />
    </linearGradient>

    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgEmerald)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle Outer Hexagon Border -->
  <path d="M32 8L50 18V46L32 56L14 46V18L32 8Z" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.2" fill="none" />

  <!-- Iconic 'V' Monogram with Metallic Emerald Gradient -->
  <path d="M18 18L32 46L46 18H38L32 34L26 18H18Z" fill="url(#vGrad)" filter="url(#glow)" />

  <!-- Ascending Growth Arrow over the V -->
  <path d="M22 36L30 28L36 32L46 18" stroke="url(#goldAccent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 18H46V24" stroke="url(#goldAccent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>